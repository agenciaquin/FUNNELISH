<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConfirmaYa — KLIXMANT</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1>ConfirmaYa</h1>
    <p class="header-subtitulo">KLIXMANT — Confirmación de pedidos</p>
  </header>

  <main>
    <!-- Sección 1: Formulario de datos del pedido -->
    <section id="seccion-formulario">

      <!-- Área de mensajes de error de validación -->
      <div id="error-msg" role="alert" aria-live="assertive"></div>

      <form id="form-pedido" novalidate>

        <div class="campo">
          <label for="input-nombre">Nombre</label>
          <input type="text" id="input-nombre" name="nombre" placeholder="Nombre completo del cliente" required>
        </div>

        <div class="campo">
          <label for="input-telefono">Teléfono</label>
          <input type="tel" id="input-telefono" name="telefono" placeholder="Ej: 3001234567 o +573001234567" required>
        </div>

        <div class="campo">
          <label for="input-direccion">Dirección</label>
          <input type="text" id="input-direccion" name="direccion" placeholder="Dirección de envío" required>
        </div>

        <div class="campo">
          <label for="input-ciudad">Ciudad</label>
          <input type="text" id="input-ciudad" name="ciudad" placeholder="Ciudad de destino" required>
        </div>

        <div class="campo">
          <label for="input-departamento">Departamento</label>
          <input type="text" id="input-departamento" name="departamento" placeholder="Departamento" required>
        </div>

        <div class="campo">
          <label for="input-correo">Correo <span class="opcional">(opcional)</span></label>
          <input type="email" id="input-correo" name="correo" placeholder="correo@ejemplo.com">
        </div>

        <div class="campo">
          <label for="input-talla">Talla <span class="opcional">(opcional)</span></label>
          <input type="text" id="input-talla" name="talla" placeholder="Ej: M, L Mujer, XL Caballero">
        </div>

        <div class="campo">
          <label for="input-producto">Nombre del Producto</label>
          <!-- list apunta al datalist que se poblará desde app.js -->
          <input type="text" id="input-producto" name="producto" list="lista-productos" placeholder="Nombre exacto del producto" required>
          <datalist id="lista-productos"></datalist>
        </div>

        <div class="campo">
          <label for="input-valor">Valor a pagar <span class="opcional">(opcional)</span></label>
          <input type="text" id="input-valor" name="valor" placeholder="Ej: $130.000">
        </div>

        <button type="button" id="btn-generar">Generar mensaje</button>

      </form>

    </section>

    <!-- Sección 2: Vista previa del mensaje y foto del producto -->
    <section id="seccion-preview">

      <h2 class="preview-titulo">Vista previa del mensaje</h2>

      <!-- Advertencia cuando el mensaje supera el límite de WhatsApp (TAREA 20) -->
      <div id="aviso-largo" class="aviso-largo" role="alert" aria-live="polite"></div>

      <!-- Contenedor flex: foto a la izquierda, texto a la derecha (en desktop) -->
      <div class="preview-contenido">

        <!-- Foto del producto -->
        <div class="preview-foto">
          <img id="img-producto" src="img/placeholder.png" alt="Foto del producto">
          <!-- Enlace de descarga como fallback si el click programático falla -->
          <a id="link-descarga" class="link-descarga" download>Descargar foto</a>
        </div>

        <!-- Mensaje generado (solo lectura) -->
        <div class="preview-mensaje">
          <textarea id="texto-mensaje" readonly rows="18" aria-label="Mensaje generado para el cliente"></textarea>
        </div>

      </div>

      <!-- Botones de acción -->
      <div class="preview-acciones">
        <button type="button" id="btn-copiar" class="btn-secundario">Copiar mensaje</button>
        <button type="button" id="btn-enviar" class="btn-primario">Enviar a cliente</button>
        <button type="button" id="btn-nuevo" class="btn-terciario">Nuevo pedido</button>
      </div>

    </section>
  </main>

  <footer>
    <p>ConfirmaYa &copy; 2024 — KLIXMANT</p>
  </footer>

  <!-- Scripts al final del body: primero catálogo, luego lógica -->
  <script src="catalogo.js"></script>
  <script src="app.js"></script>

</body>
</html>
